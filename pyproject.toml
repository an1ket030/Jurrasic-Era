[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prehistoric-sim"
version = "0.1.0"
description = "Agent-based Late Cretaceous ecosystem simulation (Hell Creek, ~67 Ma)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "PyYAML>=6.0,<7.0",
    "rich>=13.7,<14.0",
    "prompt_toolkit>=3.0,<4.0",
    "click>=8.1.7,<8.2.0",
    "typer>=0.12,<0.13",
    "pytest>=8.0,<9.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]
data = [
    "pandas>=2.2,<3.0",
]

[project.scripts]
sim = "prehistoric_sim.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
